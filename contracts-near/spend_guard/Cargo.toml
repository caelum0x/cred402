[package]
name = "spend_guard"
version = "0.1.0"
edition = "2021"
description = "NEAR Hackathon 2026 — SpendGuard: turns an agent's verified on-chain x402 revenue into a capped, protocol-enforced spending permission via NEAR Function Call Access Keys."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
borsh = "1"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
