# Cred402 self-hosting quickstart — the "git clone to a working instance in
# under 5 minutes" path, with ZERO required env vars (sim mode: in-memory
# ledger, no Casper/Stripe/Plaid credentials needed to see the full product).
#
#   docker compose up --build
#   open http://localhost:4021/
#
# This is the single-container quickstart (API serves the built console at
# the same origin — see README.md's "Single-origin production-style run").
# For the fuller local-production stack (durable event journal + the Go
# event indexer + Postgres projection target), see infra/docker-compose.yml
# instead — that one additionally requires CRED402_ADMIN_API_KEY because it
# runs with auth enabled.
services:
  cred402:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "4021:4021"
    environment:
      # Auth off by default here ONLY for the zero-config quickstart — the
      # Dockerfile's own default (CRED402_ENV=testnet) otherwise demands
      # CRED402_ADMIN_API_KEY and refuses to boot. Set this to "true" (and
      # provide CRED402_ADMIN_API_KEY) once you're past local evaluation.
      CRED402_AUTH_REQUIRED: "false"
      CRED402_DATA_DIR: /data
    volumes:
      - cred402-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4021/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  cred402-data:
