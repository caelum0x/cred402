[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# via_ir avoids "stack too deep" in the credit-note verification path and keeps the
# Flare satellite compiling reproducibly, matching the EVM satellite project.
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 256

# Real Flare-family targets. RPC endpoints are the public Flare gateways; no key needed.
#   forge script script/DeployCoston2.s.sol:DeployCoston2 --rpc-url coston2 --broadcast
[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"
flare = "https://flare-api.flare.network/ext/C/rpc"

# Coston2's explorer is Blockscout, not Etherscan. Verify with:
#   forge verify-contract <addr> Cred402FlareCreditVault \
#     --verifier blockscout \
#     --verifier-url https://coston2-explorer.flare.network/api
# (No API key required for Blockscout verification.)

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

# Cred402 Flare satellite — Interoperable Asset Products.
# "Casper approves credit; Flare executes it in XRP liquidity; FTSO prices it."
