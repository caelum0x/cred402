# Render Blueprint for the Cred402 API (the always-on backend the Vercel console
# talks to). Render runs long-lived processes, so the node:http server + SSE event
# stream + in-memory ledger work as-is — unlike serverless.
#
# Deploy: Render dashboard → New → Blueprint → connect caelum0x/cred402 → Apply.
# Live at https://cred402-1.onrender.com (pre-wired in the Vercel rewrites). No
# secrets required for sim mode; add the p8–p10 keys as environment variables to
# enable the live Testnet / Stripe / Plaid paths.
services:
  - type: web
    name: cred402
    runtime: node
    region: oregon
    # Free tier, deliberately, with eyes open. Mainnet only requires CRED402_DATA_DIR
    # to be set, not to be a mounted disk, so the paid path does enable here -- and
    # the facilitator (not this service) is the system of record for settlements, so
    # Bazaar listing, settle counts and leaderboard standing survive a restart.
    #
    # What the free tier costs us, accepted:
    #   * the x402 replay barrier lives on the ephemeral filesystem, so a restart
    #     clears it and a previously-spent payment proof could be replayed once more
    #     (bounded: one free report per replayed proof, at 0.01 USDC each);
    #   * /v1/x402/algorand/usage and the finalized receipt projection reset to empty
    #     on every restart, so local history understates real volume;
    #   * the instance sleeps, and a cold start can be slow enough that a buyer's
    #     paid request times out -- which costs real challenge volume, not eligibility.
    #
    # Upgrading to a paid plan and attaching a disk at /var/data fixes all three.
    plan: free
    # tsx + typescript live in devDependencies, so install them too (Render sets
    # NODE_ENV=production, which would otherwise skip dev deps).
    buildCommand: npm install --include=dev
    startCommand: npm start
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Satisfies the Mainnet durability gate. Ephemeral on free -- see the note above.
      - key: CRED402_DATA_DIR
        value: /tmp/cred402
      # Algorand x402 is fail-closed until the receiver is entered in the Render
      # dashboard. Render ignores new sync:false values on an existing Blueprint, so
      # operators must confirm this variable manually. Once set on Mainnet, keep it
      # stable: discovery, receipts and leaderboard rankings all key on this address.
      - key: CRED402_ALGORAND_PAY_TO
        sync: false
      # Deliberately not committed. Mainnet stays 503 until an operator types this
      # into the dashboard, exactly as I_ACKNOWLEDGE_REAL_USDC_MAINNET_PAYMENTS.
      # Putting the acknowledgement in source would defeat the gate it exists to be.
      - key: CRED402_ALGORAND_MAINNET_RELEASE_ACK
        sync: false
      # CRED402_ENV=mainnet turns auth on and demands a webhook secret. Without BOTH of
      # these loadConfig throws at import time and the service crash-loops before it
      # ever binds a port -- it does not degrade to a 503. Set them in the dashboard.
      - key: CRED402_ADMIN_API_KEY
        sync: false
      - key: CRED402_WEBHOOK_SECRET
        sync: false
      - key: CRED402_ALGORAND_NETWORK
        value: mainnet
      # Must match the network or the paid path refuses to enable.
      - key: CRED402_ENV
        value: mainnet
      - key: CRED402_ALGORAND_PRICE_MICRO_USDC
        value: "10000"
      - key: CRED402_ALGORAND_FACILITATOR_URL
        value: https://facilitator.goplausible.xyz
      - key: CRED402_ALGORAND_FACILITATOR_TIMEOUT_MS
        value: "10000"
      # Independently confirms USDC finality instead of trusting the facilitator.
      - key: CRED402_ALGORAND_INDEXER_URL
        value: https://mainnet-idx.algonode.cloud
      # Required because Render runs with NODE_ENV=production. This prevents
      # forwarded host headers from rewriting the Bazaar resource URL.
      - key: CRED402_PUBLIC_URL
        value: https://cred402-1.onrender.com
      # Sim/free mode by default. Set these in the Render dashboard to go live:
      #   CRED402_CHAIN=testnet, CRED402_NODE, CRED402_SECRET_KEY,
      #   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, PLAID_CLIENT_ID, PLAID_SECRET,
      #   CRED402_X402_FACILITATOR_URL, CRED402_SIDECAR_URL
